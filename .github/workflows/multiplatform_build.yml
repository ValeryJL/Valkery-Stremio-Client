name: Valkery Multiplatform CI & Release (Desktop + Mobile)

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop x64 & Installer
    runs-on: windows-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[ci]') ||
      contains(github.event.head_commit.message, '[release]') ||
      contains(github.event.pull_request.title, '[build]') ||
      contains(github.event.pull_request.title, '[ci]')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows Release
        run: |
          flutter build windows --release
          powershell -ExecutionPolicy Bypass -File ./scripts/fetch_streaming_engine.ps1 -TargetDir build/windows/x64/runner/Release
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Valkery-Stremio-Client-Windows-x64.zip
      - name: Compile Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows/windows_setup.iss
          options: /O+ /DFLADDER_VERSION="0.11.1"
      - uses: actions/upload-artifact@v4
        with:
          name: Valkery-Windows-Installer
          path: windows/Output/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Valkery-Stremio-Client-Windows-x64
          path: Valkery-Stremio-Client-Windows-x64.zip

  build-android:
    name: Build Android APK (Serverless Mobile)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[ci]') ||
      contains(github.event.head_commit.message, '[release]') ||
      contains(github.event.pull_request.title, '[build]') ||
      contains(github.event.pull_request.title, '[ci]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Bundle Android Native Streaming Engine
        run: |
          chmod +x ./scripts/fetch_streaming_engine.sh
          ./scripts/fetch_streaming_engine.sh android
      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release --flavor production --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with:
          name: Valkery-Stremio-Client-Android-APK
          path: build/app/outputs/flutter-apk/*.apk

  build-linux:
    name: Build Linux Desktop x64
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[ci]') ||
      contains(github.event.head_commit.message, '[release]') ||
      contains(github.event.pull_request.title, '[build]') ||
      contains(github.event.pull_request.title, '[ci]')
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build Linux Release
        run: |
          flutter pub get
          flutter build linux --release
          chmod +x ./scripts/fetch_streaming_engine.sh
          ./scripts/fetch_streaming_engine.sh linux
          tar -czvf Valkery-Stremio-Client-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: Valkery-Stremio-Client-Linux-x64
          path: Valkery-Stremio-Client-Linux-x64.tar.gz

  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[ci]') ||
      contains(github.event.head_commit.message, '[release]') ||
      contains(github.event.pull_request.title, '[build]') ||
      contains(github.event.pull_request.title, '[ci]')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build macOS Release
        run: |
          flutter pub get
          flutter build macos --release --flavor production
          chmod +x ./scripts/fetch_streaming_engine.sh
          ./scripts/fetch_streaming_engine.sh macos
          cd build/macos/Build/Products/Release-production
          zip -r ../../../../../Valkery-Stremio-Client-macOS.zip *.app
      - uses: actions/upload-artifact@v4
        with:
          name: Valkery-Stremio-Client-macOS
          path: Valkery-Stremio-Client-macOS.zip
