name: Valkery Multiplatform CI & Release (Desktop + Mobile)

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: Flutter Static Analysis & Automated QA Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run static analysis
        run: flutter analyze
      - name: Run Unit, Integration & Multiplatform Widget Tests
        run: flutter test --reporter expanded

  build-android:
    name: Build Android APK (Serverless Mobile)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Valkery-Stremio-Client-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Desktop x64
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build Windows Release
        run: |
          flutter pub get
          flutter build windows --release
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Valkery-Stremio-Client-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Valkery-Stremio-Client-Windows-x64
          path: Valkery-Stremio-Client-Windows-x64.zip

  build-linux:
    name: Build Linux Desktop x64
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build Linux Release
        run: |
          flutter pub get
          flutter build linux --release
          tar -czvf Valkery-Stremio-Client-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: Valkery-Stremio-Client-Linux-x64
          path: Valkery-Stremio-Client-Linux-x64.tar.gz

  build-macos:
    name: Build macOS Universal
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build macOS Release
        run: |
          flutter pub get
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r ../../../../../Valkery-Stremio-Client-macOS.zip valkery_stremio_client.app
      - uses: actions/upload-artifact@v4
        with:
          name: Valkery-Stremio-Client-macOS
          path: Valkery-Stremio-Client-macOS.zip
