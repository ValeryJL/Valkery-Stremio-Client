server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json application/wasm;

    add_header Access-Control-Allow-Origin "*" always;

    # Image proxy with CORS for Web CanvasKit poster rendering
    location /img-proxy/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass $arg_url;
        proxy_ssl_server_name on;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        expires 7d;
    }

    # Proxy Stremio Server streaming / stats requests through Nginx
    location /stremio/ {
        proxy_pass http://127.0.0.1:11470/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /stats.json {
        proxy_pass http://127.0.0.1:11470/stats.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|wasm|ttf|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
